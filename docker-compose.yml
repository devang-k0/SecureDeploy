services:
  app:
    build: .
    container_name: securedeploy
    ports:
      - "8000:8000"
    volumes:
      - scan_data:/app/data
    env_file:
      - .env
    environment:
      - SECUREDEPLOY_OLLAMA_URL=http://ollama:11434
      - SECUREDEPLOY_OLLAMA_MODEL=mistral
      - SECUREDEPLOY_MAX_REPO_SIZE_MB=500
      - SECUREDEPLOY_SCAN_TIMEOUT_SECONDS=600
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: securedeploy-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull the mistral model on first start
    # Run: docker exec securedeploy-ollama ollama pull mistral
    restart: unless-stopped

volumes:
  scan_data:
  ollama_data:
